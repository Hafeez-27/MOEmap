<title>MOE Site Engineer Allocation Maps</title>
<script>/* default zoom: 80% on a Mac, 67% on Windows (desktop only) */(function(){try{var n=navigator,p=(n.userAgentData&&n.userAgentData.platform)||n.platform||'',z=/Mac/i.test(p)&&!(n.maxTouchPoints>1)?0.8:/Win/i.test(p)?0.67:1;if(z!==1){document.documentElement.style.setProperty('--z',z);document.documentElement.classList.add('zoomed');}}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/*__MAPLIBRE_CSS__*/
/* One screen: headline + headcount bar on top, explanation panel on the left, map on the right.
   Colour always means "who looks after this site": green = Emirati national, blue = city shared, orange = city pool,
   magenta = remote shared. Shape adds the rest: lines join a shared pair, dashed areas outline a pool patch, offices are dots with a white centre. */
:root{
  color-scheme:light;
  --chg:#6D28D9; --chgk:#4C1D95; --chgl:#CDBDF4; --chgbg:#F6F2FF; --bad:#B42318;
  --ink:#15233B; --ink2:#3A4659; --mut:#5F6B80; --line:#E4E8EF; --mist:#D2D9E3; --paper:#F5F7FA; --sheet:#FFFFFF; --hi:#F2C230;
  --nat:#10744F; --pair:#2A78D6; --pool:#EE8A2E; --poolk:#A65A12; --rem:#B64A9A; --hq:#9AA4B3;
  --boy:#2457A6; --girl:#C2387F; --mix:#8A6D1A;
  --t1:#1F8A4C; --t2:#C98F00; --t3:#C8372D;
  --sea:#DCE8F1; --seal:#B9CFDF; --land:#F4F2EC; --mway:#D3D8DF;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
/* default zoom (see the script at the top): the page is laid out larger and scaled down, like the browser's own zoom */
html.zoomed{overflow:hidden}html.zoomed body{transform:scale(var(--z));transform-origin:0 0;width:calc(100vw / var(--z));height:calc(100vh / var(--z))}html.zoomed dialog{scale:var(--z)}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.5 var(--sans);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--cond);margin:0;text-wrap:balance}

/* header */
.top{background:var(--sheet);border-bottom:1px solid var(--mist);padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto minmax(260px,1fr) minmax(420px,1.6fr);gap:10px 28px;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.brand img{display:block;height:48px;width:auto}
.brand i{width:1px;height:40px;background:var(--mist)}
.top h1{font-size:23px;font-weight:700;line-height:1.1}
.top .sub{color:var(--ink2);font-size:13px;margin-top:3px;max-width:62ch}
.hc{display:grid;gap:7px}
.hc-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hc-head b{font:700 15px var(--cond)}
.hc-head span{color:var(--mut);font-size:12px}
.hc-head b em,.hc-keys em{font-style:normal;font-weight:700;color:var(--chg);margin-left:3px}
.hc-head b em{font:600 12.5px var(--sans)}
.dm{font-style:normal;font-weight:700;color:var(--chg);margin-left:3px}
.chgtag{font-style:normal;font-size:10.5px;font-weight:700;color:var(--chgk);background:var(--chgbg);border:1px solid var(--chgl);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap}
.notlive{margin:0 0 10px;padding:6px 9px;border:1px solid var(--chgl);background:var(--chgbg);color:var(--chgk);border-radius:6px;font-size:12.5px}
.bar{display:flex;gap:2px;height:22px}
.bar button{border:0;padding:0;cursor:pointer;min-width:6px;border-radius:2px;position:relative}
.bar button:first-child{border-radius:4px 2px 2px 4px}.bar button:last-child{border-radius:2px 4px 4px 2px}
.bar button.hq{cursor:default;background:repeating-linear-gradient(135deg,var(--hq) 0 3px,#C5CCD6 3px 6px)}
.bar button.off{opacity:.25}
.bar button:hover:not(.hq){filter:brightness(1.08)}
.hc-keys{display:flex;flex-wrap:wrap;gap:4px 18px}
.hc-keys button{display:flex;align-items:baseline;gap:6px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.hc-keys button.off{opacity:.4;text-decoration:line-through}
.hc-keys button.hq{cursor:default}
.hc-keys i{width:10px;height:10px;border-radius:2px;align-self:center;flex:none}
.hc-keys b{font:700 16px var(--cond)}
.hc-keys span{color:var(--ink2);font-size:12px}

.main{flex:1;display:flex;min-height:0}
.side{width:var(--side-w,420px);flex:none;display:flex;flex-direction:column;border-right:1px solid var(--mist);background:var(--sheet);min-height:0;position:relative;transition:width .18s ease}
.side.dragging{transition:none;user-select:none}
.main.collapsed .side{display:none}
/* drag the panel's edge to resize it; the small round button hides it; the tab on the map brings it back */
.side-grip{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:12;touch-action:none}
.side-grip::after{content:'';position:absolute;left:4px;top:0;bottom:0;width:2px;background:transparent;transition:background .12s}
.side-grip:hover::after,.side.dragging .side-grip::after{background:var(--chg)}
.side-hide,.side-show{display:grid;place-items:center;border:1px solid var(--mist);background:var(--sheet);color:var(--ink2);cursor:pointer;box-shadow:0 1px 6px rgba(21,35,59,.14)}
.side-hide{position:absolute;right:-13px;top:46px;z-index:13;width:26px;height:26px;border-radius:50%;padding:0}
.side-hide:hover,.side-show:hover{color:var(--ink);border-color:var(--ink)}
.side-show{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:9;border-left:0;border-radius:0 8px 8px 0;padding:10px 6px;font:600 12px var(--cond);writing-mode:vertical-rl;gap:6px}
.side-show[hidden],.side-hide[hidden]{display:none}
.tabs{display:flex;border-bottom:1px solid var(--mist);padding:0 8px}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px 8px;font:600 14px var(--cond);color:var(--mut);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--mist);background:var(--paper)}
.ctrl label{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--mist);border-radius:6px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--mist)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
select,input[type=search]{border:1px solid var(--mist);border-radius:6px;padding:4px 8px;background:var(--sheet)}
.pane{flex:1;overflow:auto;padding:16px 18px 32px;min-height:0}
.pane h2{font-size:16px;font-weight:700;margin:22px 0 8px}
.pane h2:first-child{margin-top:0}
.pane p{margin:0 0 10px;color:var(--ink2);max-width:62ch}
.lede{font-size:14px;color:var(--ink)!important}

/* how to read */
.key{display:grid;gap:7px;margin:0 0 6px;padding:10px 12px;background:var(--paper);border-radius:6px}
.key div{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;color:var(--ink2)}
.key svg{display:block}
/* coverage blocks: a coloured rule says which engineer type the block is about */
.blk{border-left:4px solid var(--c);padding:2px 0 2px 12px;margin:0 0 18px}
.blk-h{display:flex;align-items:baseline;gap:10px}
.blk-h b{font:700 28px/1 var(--cond);color:var(--ink)}
.blk-h span{font:600 15px var(--cond)}
.blk p{margin:4px 0 6px}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.facts li{color:var(--ink2);padding-left:14px;position:relative}
.facts li::before{content:'';position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--c)}
.facts b{color:var(--ink)}
.dist{margin:8px 0 4px}
.dist .db{display:flex;gap:2px;height:14px}
.dist .db div{border-radius:2px;cursor:default}
.dist .dl{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px;font-size:12px;color:var(--ink2)}
.dist .dl i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.confirm{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink2)}
.confirm b{color:var(--ink)}

/* zones */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font:600 12px var(--cond);color:var(--mut)}
tr.tot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
tbody tr.zr{cursor:pointer}tbody tr.zr:hover td{background:var(--paper)}
tr.zr small{color:var(--mut)}
.mini{display:flex;gap:1px;height:6px;margin-top:4px;width:100%}
.mini div{border-radius:1px}

/* engineer list */
.filters{display:grid;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mist);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;background:var(--sheet)}
.chip[aria-pressed="false"]{opacity:.45}
.chip i{width:9px;height:9px;border-radius:50%}
input[type=search]{width:100%}
.count{color:var(--mut);font-size:12px;margin:0 0 6px}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.list li:hover{background:var(--paper)}
.list li.sel{background:#FFF8DC;box-shadow:inset 3px 0 0 var(--hi)}
.list li > i{width:10px;height:10px;border-radius:50%;margin-top:5px}
.list .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .rt{font:600 12px var(--cond);color:var(--ink2);text-align:right}
.list .meta{grid-column:2/-1;color:var(--mut);font-size:12px}

/* method */
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li b{display:block;font:600 14px var(--cond);color:var(--ink)}
.rules li span{color:var(--ink2)}
.src{color:var(--mut);font-size:12px;margin-top:14px}

/* map */
.mapwrap{flex:1;position:relative;min-width:0;background:var(--sea)}
#map{position:absolute;inset:0}
.legend{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:64px;z-index:5;background:var(--sheet);border:1px solid var(--mist);border-radius:6px;padding:9px 12px;font-size:12px;display:grid;gap:5px;max-width:260px;box-shadow:0 2px 10px rgba(21,35,59,.08)}
/* search on the map */
.msearch{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));top:10px;z-index:9;width:min(390px,calc(100% - 70px))}
.msearch .box{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;background:var(--sheet);border:1px solid var(--mist);border-radius:8px;box-shadow:0 2px 12px rgba(21,35,59,.12)}
.msearch .box:focus-within{border-color:var(--ink);box-shadow:0 2px 14px rgba(21,35,59,.18)}
.msearch svg{flex:none;color:var(--mut)}
.msearch input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;color:var(--ink);height:100%}
.msearch input::placeholder{color:var(--mut)}
.msearch kbd{font:600 11px var(--sans);color:var(--mut);border:1px solid var(--mist);border-radius:4px;padding:1px 6px;line-height:16px}
.msearch .box:focus-within kbd,.msearch input:not(:placeholder-shown) ~ kbd{display:none}
.mres{list-style:none;margin:6px 0 0;padding:4px;background:var(--sheet);border:1px solid var(--mist);border-radius:8px;box-shadow:0 10px 30px rgba(21,35,59,.16);max-height:min(440px,calc(100vh - 260px));overflow:auto}
.mres li{display:grid;grid-template-columns:12px 1fr auto;gap:1px 10px;align-items:baseline;padding:7px 9px;border-radius:5px;cursor:pointer}
.mres li.act{background:var(--paper)}
.mres li > i{width:10px;height:10px;border-radius:50%;align-self:center;grid-row:span 2}
.mres li > i.z{background:none!important;border:2px solid var(--ink);width:10px;height:10px;box-sizing:border-box;border-radius:3px}
.mres .t{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mres .ty{font:600 11px var(--cond);color:var(--mut)}
.mres .s{grid-column:2 / 4;color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mres li.none{display:block;color:var(--ink2);cursor:default;font-size:12.5px;line-height:1.45}
.detail tr.hit td{background:#FFF8DC}
.dask{margin:10px 0 0}.dask button{width:100%;font:inherit;font-weight:600;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:6px;padding:7px 10px;cursor:pointer}
.dask button:hover{background:var(--paper)}
/* ask AI */
.pane.ai{display:flex;flex-direction:column;padding:0;overflow:hidden}
.pane.ai[hidden]{display:none}
.ai-top{padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.ai-ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.ai-ctx .pk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--mist);border-radius:999px;padding:1px 2px 1px 9px;background:var(--sheet);color:var(--ink);font-size:12px;max-width:100%}
.ai-ctx .pk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-ctx .pk i{width:8px;height:8px;border-radius:50%;flex:none}
.ai-ctx .pkclr{border:0;background:none;padding:0 2px;font:inherit;font-size:12px;font-weight:600;color:var(--ink);text-decoration:underline;cursor:pointer}
.ai-ctx .pk button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 5px}
.ai-log{flex:1;overflow:auto;padding:14px 16px 6px;min-height:0}
.ai-hello p{color:var(--ink2);margin:0 0 8px}
.msg{margin:0 0 16px}
.msg.u{display:flex;flex-direction:column;align-items:flex-end}
.msg.u .bub{background:var(--ink);color:#fff;border-radius:12px 12px 3px 12px;padding:7px 12px;max-width:88%;white-space:pre-wrap;font-size:13.5px}
.msg.u .ctx{font-size:11.5px;color:var(--mut);margin:0 2px 3px;max-width:88%;text-align:right}
.msg.a{font-size:13.5px;line-height:1.55;color:var(--ink)}
.msg.a p{margin:0 0 8px;color:var(--ink);max-width:none}
.msg.a ul,.msg.a ol{margin:2px 0 8px;padding-left:20px}
.msg.a li{margin:2px 0}
.msg.a .mdh{font-weight:700;margin:8px 0 4px}
.msg.a .wait{color:var(--mut)}
.msg.a .err{color:var(--bad)}
.mdt{border-collapse:collapse;margin:4px 0 10px;font-size:12.5px;width:100%}
.mdt th,.mdt td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:normal;vertical-align:top}
.mdt th{color:var(--mut);font-weight:600}
.ref{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--mist);background:var(--paper);border-radius:999px;padding:0 8px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;line-height:20px;max-width:100%;vertical-align:baseline}
.ref:hover{border-color:var(--ink)}
.ref i{width:8px;height:8px;border-radius:50%;flex:none}
.ref i.z,.ai-ctx .pk i.z{background:none!important;border:1.5px solid var(--ink);border-radius:2px;box-sizing:border-box}
.showall{border:0;background:none;color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
.chg-card{border:1px solid var(--chgl);background:var(--chgbg);border-radius:6px;padding:8px 10px;margin:8px 0 6px;font-size:12.5px}
.chg-card b{color:var(--chgk)}
.chg-card ul{margin:4px 0 0;padding-left:18px}.chg-card li.bad{color:var(--bad)}
.chg-card .broke{color:var(--bad);margin:6px 0 0;font-size:12px}
.rule-card{border:1px solid #F1B5AE;background:#FFF4F2;border-radius:6px;padding:9px 11px;margin:8px 0 6px;font-size:12.5px}
.rule-card b{color:var(--bad)}.rule-card ul{margin:4px 0 6px;padding-left:18px;color:var(--bad)}.rule-card p{margin:0 0 6px;color:var(--ink2)}
.rules-broken{border:1px solid #F1B5AE;background:#FFF4F2;border-radius:6px;padding:7px 10px;margin:6px 0;font-size:12.5px}
.rules-broken b{color:var(--bad)}.rules-broken ul{margin:3px 0 0;padding-left:18px;color:var(--bad)}.rules-broken li span{color:var(--ink2);font-style:italic}
.ackbox{display:flex!important;gap:8px;align-items:flex-start;font-weight:400!important;margin:8px 0 0!important;color:var(--ink)}
.ackbox input{width:auto!important;margin-top:3px}
.ai-sugg{display:flex;gap:6px;padding:4px 16px 8px;overflow-x:auto;scrollbar-width:thin}
.ai-sugg .sugg{flex:none;white-space:nowrap}
.sugg{border:1px solid var(--mist);background:var(--sheet);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;text-align:left}
.sugg:hover{border-color:var(--ink);background:var(--paper)}
.ai-form{display:flex;gap:8px;padding:8px 16px 12px;border-top:1px solid var(--line);align-items:stretch}
.ai-clip{flex:none;width:38px;border:1px solid var(--mist)!important;background:var(--sheet)!important;color:var(--ink2)!important;border-radius:8px;padding:0!important;display:grid;place-items:center;cursor:pointer}
.ai-clip:hover{border-color:var(--ink)!important;color:var(--ink)!important}
.ai-files{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0;border-top:1px solid var(--line)}
.ai-files+.ai-form{border-top:0}
.af{display:inline-flex;align-items:center;gap:6px;max-width:100%;border:1px solid var(--mist);background:var(--sheet);border-radius:6px;padding:3px 4px 3px 4px;font-size:12px;color:var(--ink)}
.af img{width:26px;height:26px;object-fit:cover;border-radius:3px;flex:none}
.af .fi{flex:none;min-width:26px;height:26px;border-radius:3px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font:700 9.5px var(--cond);color:var(--ink2);padding:0 2px}
.af .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:20ch}
.af small{color:var(--mut);white-space:nowrap}
.af button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.af.bad{border-color:#F1B5AE;background:#FFF4F2;color:var(--bad);padding:4px 8px}
.ufiles{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;margin:0 0 4px;max-width:88%}
.ufiles .af{background:var(--paper)}
.pane.ai.drop{outline:2px dashed var(--chg);outline-offset:-6px;background:var(--chgbg)}
.ai-form textarea{flex:1;resize:none;border:1px solid var(--mist);border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;line-height:1.4;min-height:40px;max-height:140px;color:var(--ink)}
.ai-form textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.ai-form button{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:0 16px;font-weight:600;cursor:pointer}
.ai-form button:disabled{opacity:.35;cursor:default}
.ai-note{font-size:11.5px;color:var(--mut);padding:0 16px 10px;margin:0}
/* who answered, the planning steps, Stop / New chat */
.ai-top{display:flex;gap:8px;align-items:flex-start}.ai-top .ai-ctx{flex:1;min-width:0}
.ai-new{flex:none;border:1px solid var(--mist);background:var(--sheet);border-radius:6px;font:inherit;font-size:12px;font-weight:600;padding:2px 9px;color:var(--ink);cursor:pointer}
.ai-new:hover{border-color:var(--ink)}
.ai-form button.stop{background:var(--sheet);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.msg.a .by{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:11.5px;color:var(--mut)}
.by i{width:7px;height:7px;border-radius:50%;background:#8D97A6;flex:none}.by.cl i{background:var(--chg)}
.psteps{border:1px solid var(--chgl);border-radius:8px;background:var(--sheet);margin:2px 0 10px;overflow:hidden}
.ps-head{display:flex;width:100%;align-items:center;gap:8px;border:0;background:var(--chgbg);padding:7px 10px;font:inherit;font-size:12.5px;color:var(--chgk);cursor:pointer;text-align:left}

  </div>

  <h2>The ${['', '', 'two', 'three', 'four'][usedKinds().length] || usedKinds().length} ways a site is covered</h2>
  <div class="blk" style="--c:${C('national')}">
    <div class="blk-h"><b>${cnt('national')}</b>${notLive() ? dMark(cnt('national') - liveCnt('national')) : ''}<span>Emirati nationals</span></div>
    <p>${allRemote ? `Every remote school gets its own Emirati national, working on site` : `The ${cnt('national')} largest remote schools each get one Emirati national, working on site`}. Nationals are never shared with another school; MOE has confirmed this.</p>

    ${offices.every(o => !o.approx) ? `<li><b>The ${offices.length} offices</b> have real names and locations from the workbook (the earlier list of 48 had 10 unnamed placeholders, now dropped). ${ST.ns_users_assumed} have no user count, so the workbook's 75 users is assumed.</li>` : `<li><b>${ST.ns_placeholders} offices are placeholders</b> and none of the ${offices.length} has a map location; they are placed by area. ${ST.ns_users_assumed} have no user count, so the workbook's 75 users is assumed. The on-ground count is 38 offices, not ${offices.length}.</li>`}

    $('#svgo').disabled = true; $('#svgo').textContent = 'Saving…'; $('#sverr').hidden = true;
    try {
      const r = await fetch('api/scenarios', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, summary: $('#svs').value, ops: draft.ops.map(({ _id, _bad, ...o }) => o), createdBy: who || 'the map' }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || `Not saved (${r.status}).`);
      const link = versionLink(j.id);
      dlg.innerHTML = `<form method="dialog"><h3>Version saved</h3><p class="ok">"${esc(j.name)}" is saved. It is not published: only people with this link can open it.</p>
        <div class="vlinkbox"><input readonly value="${esc(link)}" aria-label="Link to this version" id="svlink"><button type="button" id="svcopy">Copy link</button></div>
        <div class="acts"><a class="sugg" href="${esc(link)}" target="_blank" rel="noopener">Open it</a><button type="submit" class="p">Close</button></div></form>`;
      $('#svcopy').onclick = ev2 => copyText(link, ev2.currentTarget); $('#svlink').onfocus = e2 => e2.target.select();
    } catch (err) { $('#sverr').textContent = err.message; $('#sverr').hidden = false; $('#svgo').disabled = false; $('#svgo').textContent = 'Save version'; }
  };
}
// "Use these changes": a version's changes become this browser's simulated plan (replacing it), shown before / after
function useVersion() {
  if (!VIEWING?.version) return;
  try { localStorage.setItem('moe-draft-v1', JSON.stringify({ ops: VIEWING.proposal.ops.map(o => ({ ...o, _id: rid() })) })); sessionStorage.setItem('moe-open-compare', '1'); } catch {}
  location.href = location.pathname;
}

// ---------- "Request plan update": name, note, send; the approvers get an email ----------
function openRequest() {
  if (!draft.ops.length || !SIM) return;
  const dlg = $('#reqdlg'), lines = PlanEngine.impactLines(SIM.imp), rules = SIM.imp.warnings.filter(w => w.level === 'rule');
  let name = ''; try { name = localStorage.getItem('moe-name') || ''; } catch {}
  dlg.innerHTML = `<form method="dialog" id="reqf"><h3 id="reqh">Request plan update</h3>
    <p>Sithesvaran Thirumaran and Sanath Swaroop will get an email with these changes and their impact. The live plan changes only when one of them confirms.</p>
    <ul>${SIM.res.log.filter(l => l.ok).map(l => `<li>${esc(l.text)}</li>`).join('')}${lines.filter(l => /^Watch/.test(l)).map(l => `<li class="w">${esc(l)}</li>`).join('')}</ul>
    ${rules.length ? `<div class="rules-broken"><b>These changes break ${rules.length === 1 ? 'an MOE rule' : `${rules.length} MOE rules`}</b><ul>${rules.map(w => `<li>${esc(w.text)}</li>`).join('')}</ul><label class="ackbox"><input type="checkbox" id="reqack"> I understand, and I want the approvers to decide. They will see that I chose to break ${rules.length === 1 ? 'this rule' : 'these rules'}.</label></div>` : ''}
    <label for="reqn">Your name</label><input id="reqn" autocomplete="name" required maxlength="80" value="${esc(name)}">
    <label for="reqnote">Note for the approvers (optional)</label><textarea id="reqnote" maxlength="600" placeholder="Why these changes?"></textarea>
    <p class="err" id="reqerr" hidden></p>
    <div class="acts"><button type="button" id="reqc">Cancel</button><button type="submit" class="p" id="reqs">Send for approval</button></div></form>`;
  dlg.showModal();
  $('#reqc').onclick = () => dlg.close();
  if (rules.length) { $('#reqs').disabled = true; $('#reqack').onchange = () => { $('#reqs').disabled = !$('#reqack').checked; }; }
  $('#reqf').onsubmit = async ev => {
    ev.preventDefault();
    const requester = $('#reqn').value.trim(); if (!requester) return;
    try { localStorage.setItem('moe-name', requester); } catch {}
    $('#reqs').disabled = true; $('#reqs').textContent = 'Sending…'; $('#reqerr').hidden = true;
    try {
      const r = await fetch('api/proposals', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ requester, note: $('#reqnote').value, ops: draft.ops.map(({ _id, ...o }, k) => (k === 0 && rules.length ? { ...o, ack: [...new Set([...(o.ack || []), ...rules.map(w => w.key)])] } : o)) }) });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || `Not sent (${r.status}).`);
      draft.ops = []; saveDraft(); await resimulate();
      dlg.innerHTML = `<form method="dialog"><h3>Sent for approval</h3><p class="ok">${esc((j.sentTo || []).join(' and ') || 'The approvers')} ${j.sentTo?.length === 1 ? 'has' : 'have'} been emailed.${j.error ? ` ${esc(j.error)}` : ''}</p><p>The map shows the live plan again. Once a change is confirmed, everyone sees the new plan.</p>
        <div class="acts"><a class="sugg" href="?proposal=${encodeURIComponent(j.id)}">See the proposal on the map</a><button type="submit" class="p">Close</button></div></form>`;
    } catch (err) { $('#reqerr').textContent = err.message; $('#reqerr').hidden = false; $('#reqs').disabled = false; $('#reqs').textContent = 'Send for approval'; }
  };
}

// ---------- start: the live plan, a proposal from an email link, or this browser's simulated changes ----------
async function boot() {
  loadDraft();
  if (location.protocol.startsWith('http')) {
    try { const r = await fetch('api/plan'); if (r.ok) { const j = await r.json(); LIVEPLAN = j.plan; LIVEMETA = j.meta; ONLINE = true; ONLINE_PROP = !!j.proposals; AI_MODELS = j.ai || null; } } catch {}
  }
  LIVEENG = new Map(LIVEPLAN.sites.map(s => [s.id, s.eng]));
  const pid = new URLSearchParams(location.search).get('proposal');
  if (pid && ONLINE) {
    try {
      const r = await fetch('api/proposals/' + encodeURIComponent(pid)); const j = await r.json();
      if (r.ok && j.plan) { VIEWING = { proposal: j.proposal, decision: j.decision, plan: j.plan }; LIVEENG = new Map((await (await fetch('api/plan')).json()).plan.sites.map(s => [s.id, s.eng])); renderPlan(j.plan, j.proposal.changedSites, j.proposal.changedEngs || []); renderDraft(); renderChat(); map.getSource('sites') ? enterCompare('after') : map.once('load', () => enterCompare('after')); return; }
    } catch {}
  }
  const vid = new URLSearchParams(location.search).get('version');
  if (vid && ONLINE) {
    try {
      const r = await fetch('api/scenarios/' + encodeURIComponent(vid)); const j = await r.json();
      if (r.ok && j.plan) { VIEWING = { proposal: j.version, decision: null, plan: j.plan, version: true }; renderPlan(j.plan, j.version.changedSites, j.version.changedEngs || []); renderDraft(); renderChat(); map.getSource('sites') ? enterCompare('after') : map.once('load', () => enterCompare('after')); return; }
      renderPlan(LIVEPLAN); renderDraft(); renderChat();
      const bar = $('#draftbar'); bar.innerHTML = `<span><b>This map version could not be opened.</b> ${esc(j.error || 'The link may be wrong.')}</span><button type="button" class="p" id="dblive">Show the live plan</button>`; bar.hidden = false; $('#dblive').onclick = () => { location.href = location.pathname; };
      return;
    } catch {}
  }
  if (draft.ops.length) await resimulate(); else { renderPlan(LIVEPLAN); renderDraft(); }
  renderChat();
  let openCmp = false; try { openCmp = sessionStorage.getItem('moe-open-compare') === '1'; sessionStorage.removeItem('moe-open-compare'); } catch {}
  if (openCmp && draft.ops.length) map.getSource('sites') ? enterCompare('after') : map.once('load', () => enterCompare('after'));
}
boot();

// ---------- wiring ----------
$$('.tabs button').forEach(b => b.onclick = () => { $$('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); for (const p of ['overview', 'ai', 'zones', 'engineers', 'method']) $('#p-' + p).hidden = p !== b.dataset.p; sizeSide(); if (b.dataset.p === 'ai') setTimeout(() => $('#ai-q').focus(), 30); });

// ---------- the side panel: wider for Ask AI; drag its edge to resize (remembered per tab type); hide it to give the map the screen ----------
const SIDE_KEY = 'moe-side-v1';
let sidePref = (() => { try { return JSON.parse(localStorage.getItem(SIDE_KEY)) || {}; } catch { return {}; } })();
const saveSide = () => { try { localStorage.setItem(SIDE_KEY, JSON.stringify(sidePref)); } catch {} };
const sideMode = () => ($('#p-ai').hidden ? 'other' : 'ai');
const sideRoom = () => $('.main').clientWidth;
function sideWidth(mode) {
  const room = sideRoom(), want = sidePref[mode] || (mode === 'ai' ? Math.max(560, Math.round(room * 0.36)) : 420);
  return Math.round(Math.min(Math.max(320, room - 380), Math.max(320, want)));
}
function sizeSide() { $('#side').style.setProperty('--side-w', sideWidth(sideMode()) + 'px'); }
function hideSide() { $('.main').classList.add('collapsed'); $('#side-show').hidden = false; sidePref.collapsed = true; saveSide(); $('#side-show').focus(); }
function showSide() { if (!$('.main').classList.contains('collapsed')) return; $('.main').classList.remove('collapsed'); $('#side-show').hidden = true; sidePref.collapsed = false; saveSide(); }
$('#side-hide').onclick = hideSide;
$('#side-show').onclick = () => { showSide(); sizeSide(); };
{ const grip = $('#side-grip'), side = $('#side'); let start = null;
  grip.addEventListener('pointerdown', ev => { if (ev.button !== 0) return; ev.preventDefault(); grip.setPointerCapture(ev.pointerId); const r = side.getBoundingClientRect(); start = { left: r.left, k: r.width / side.offsetWidth || 1 }; side.classList.add('dragging'); });
  grip.addEventListener('pointermove', ev => { if (!start) return; const w = (ev.clientX - start.left) / start.k; sidePref[sideMode()] = Math.round(Math.min(Math.max(320, sideRoom() - 380), Math.max(320, w))); sizeSide(); });
  const end = () => { if (!start) return; start = null; side.classList.remove('dragging'); saveSide(); };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', () => { delete sidePref[sideMode()]; saveSide(); sizeSide(); });
  grip.addEventListener('keydown', ev => { if (ev.key !== 'ArrowLeft' && ev.key !== 'ArrowRight') return; ev.preventDefault(); sidePref[sideMode()] = sideWidth(sideMode()) + (ev.key === 'ArrowRight' ? 40 : -40); sizeSide(); saveSide(); });
  grip.tabIndex = 0;
  if (sidePref.collapsed && innerWidth > 820) { $('.main').classList.add('collapsed'); $('#side-show').hidden = false; }
  sizeSide(); addEventListener('resize', sizeSide);
  // the map fills whatever room the panel leaves
  let rq = 0; new ResizeObserver(() => { cancelAnimationFrame(rq); rq = requestAnimationFrame(() => map.resize()); }).observe($('#map')); }
$('#p-zones').addEventListener('click', ev => { const tr = ev.target.closest('tr.zr'); if (tr) { $('#zone').value = tr.dataset.z; applyFilter(); flyZone(tr.dataset.z); } });
$('#p-zones').addEventListener('keydown', ev => { const tr = ev.target.closest('tr.zr'); if (tr && ev.key === 'Enter') { $('#zone').value = tr.dataset.z; applyFilter(); flyZone(tr.dataset.z); } });
addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#reqdlg').open) { clearSel(); setPicks([]); if (ISO && !ISO.fromPreview) unisolate(); } });
$('#lgt').onclick = () => { const o = $('#lgt').getAttribute('aria-expanded') === 'true'; $('#lgt').setAttribute('aria-expanded', !o); $('#lgt').textContent = o ? 'Show' : 'Hide'; $('#legend').hidden = o; if (map.loaded()) clampCards(); };
if (innerWidth < 820) $('#lgt').click();
list(); legend();
})();
</script>
